<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12100d" />
    <meta name="description" content="LockIn turns your syllabus into a study plan: topics, deadlines, focus sessions, and a review queue that tells you what to study next." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LockIn · Study planner</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var p = localStorage.getItem('lockin.theme') || 'system'
        var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <style>
      html { background: #12100d; }
      html[data-theme='light'] { background: #f3eee4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
